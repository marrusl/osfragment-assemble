apiVersion: osfragment/v1alpha1
kind: Composition

# Unpinned on purpose: every fragment here adapts to the base it is assembled
# onto rather than requiring a particular one, so a current base is the point.
# Pin by digest if you want byte-reproducible rebuilds.
base: quay.io/centos-bootc/centos-bootc:stream10

# One of each kind of fragment the format supports, composed into a single image:
#   epel              — repo-only fragment, packages chosen by the consumer
#   grafana           — repo + tree + preset, all the declarative pieces
#   awscli-zip        — hook-only fragment carrying a vendor zip
#   nvidia-driver-run — hook + tree fragment carrying a vendor .run installer
fragments:
  - image: quay.io/marrusl2/fragments/epel:10
    packages: [htop, tmux, jq]
  - image: quay.io/marrusl2/fragments/grafana:11.0
  - image: quay.io/marrusl2/fragments/awscli-zip:2.36.16
  - image: quay.io/marrusl2/fragments/nvidia-driver-run:610.57.04

[fragment]
name = "postgresql"
version = "17"
description = "PostgreSQL Global Development Group RPM repository"
vendor = "PostgreSQL Global Development Group"
phase = "repos"

[fragment.provides]
repos = ["pgdg-common", "pgdg17"]

[fragment.packages]
available = [
    "postgresql17-server",
    "postgresql17",
    "postgresql16-server",
    "postgresql16",
]

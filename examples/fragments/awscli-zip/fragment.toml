[fragment]
name = "awscli-zip"
version = "2.36.16"
description = "AWS CLI v2 from the vendor's self-contained zip, installed under /usr instead of /usr/local"
vendor = "Amazon Web Services, Inc."

# No [fragment.packages] section on purpose.
#
# The only build dependency is `unzip`, which hook/entrypoint installs AND
# removes inside a single RUN. Declaring it as packages.required would install
# it during the earlier batched dnf step, where a later removal writes only a
# whiteout and the bytes stay recoverable in that layer forever.
# See process-docs/skills/containerfile-layer-semantics.md.

# The grafana RPM creates its state and log directories in %post, so nothing
# declares them and `bootc container lint` reports them as content in /var
# with no tmpfiles.d entry. In image mode /var is a first-boot seed, so these
# have to be declared to survive a fresh /var anyway.
#Type Path             Mode Owner   Group   Age Argument
d     /var/lib/grafana 0755 grafana grafana -   -
d     /var/log/grafana 0755 grafana grafana -   -

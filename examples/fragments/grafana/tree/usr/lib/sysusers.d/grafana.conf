# The grafana RPM creates its account with a %post `useradd` instead of a
# sysusers.d fragment, which `bootc container lint` flags. Declare the same
# account declaratively: a system user with a matching group, no login shell,
# and the package directory as its home. IDs stay dynamic, exactly as the
# RPM's `useradd -r`/`groupadd -r` leave them.
#Type Name    ID GECOS          Home directory     Shell
u     grafana -  "grafana user" /usr/share/grafana /sbin/nologin

# The fragment owns nouveau blacklisting, not nvidia-installer.
#
# The installer's default path writes its own modprobe.d file and then wants to
# rebuild the initramfs. hooks/entrypoint passes --no-disable-nouveau to stop
# that, so this file and tree/usr/lib/bootc/kargs.d/50-nvidia.toml are the only
# things blacklisting nouveau. They are plain files the tool copies verbatim.
blacklist nouveau
options nouveau modeset=0
